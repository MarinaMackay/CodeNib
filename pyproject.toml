[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeminer"
version = "0.1.0"
description = "A code analysis agent with graph-enhancement"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [{ name = "Zhongming Yu", email = "zhy025@ucsd.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "igraph>=0.11.6",                     # For graph data structure and algorithms
    "matplotlib>=3.4.0",                  # For visualization of graphs
    "pytest>=6.0.0",                      # For testing
    "rank_bm25>=0.2.2",                    # For best match
    "langchain>=0.3.26",                   # Core langchain functionality
    "langchain-core>=0.3.75",              # Core langchain types and interfaces
    "langchain-community>=0.3.28",        # Community integrations (BM25, FAISS)
    "langchain-anthropic>=0.3.19",         # For Anthropic LLMs
    "langchain-openai>=0.3.32",            # For OpenAI LLMs
    "langchain-google-vertexai>=2.1.1",   # For Vertex AI LLMs (better support)
    "langchain-huggingface>=0.3.1",       # For HuggingFace embeddings
    "pymilvus>=2.6.0",                    # For Milvus vector database with BM25 support
    "faiss-cpu>=1.7.0",                   # For FAISS similarity search
    "sentence-transformers>=2.2.0",       # For code-text similarity
    "tree-sitter-language-pack>=0.1.0",  # For code parsing with tree-sitter
    "fastapi>=0.100.0",                   # For API endpoints
    "pydantic>=2.0.0",                    # For data validation
    "uvicorn>=0.20.0",                    # ASGI server for FastAPI
    "rich>=14.0.0",                       # For enhanced terminal output
    "datasets>=3.5.0",                    # For dataset handling and loading
    "PyStemmer>=3.0.0",                 # For stemmer (faster than NLTK)
    "vllm>=0.10.2",                     # For vllm
    "requests>=2.25.0",                 # For HTTP requests (health checks, etc.)
    "rank-llm",                         # RankLLM reranker integration (OpenRouter/OpenAI)
]

[project.optional-dependencies]
dev = ["black>=22.3.0", "isort>=5.10.1", "mypy>=0.950", "flake8>=4.0.1"]
test = ["pytest>=6.0.0", "pytest-cov>=3.0.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)
include = ["codeminer*"]  # package names should match these glob patterns (["*"] by default)
exclude = ["eval*"]  # exclude packages matching these glob patterns

[tool.setuptools.package-data]
"codeminer.scip_interface" = ["*.proto", "*.yml", "*.sh", "README.md"]
