[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeminer"
version = "0.1.0"
description = "A code analysis agent with graph-enhancement"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
authors = [{ name = "Zhongming Yu", email = "zhy025@ucsd.edu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "igraph>=0.11.6",                     # For graph data structure and algorithms
    "matplotlib>=3.4.0",                  # For visualization of graphs
    "pytest>=6.0.0",                      # For testing
    "llama-index-retrievers-bm25>=0.5.0", # For BM25 retrieval (legacy support)
    "llama-index-core>=0.12.28",          # For core functionalities
    "llama-index-llms-anthropic>=0.6.10", # For Anthropic LLMs
    "llama-index-llms-openai>=0.3.22",    # For OpenAI LLMs
    "llama-index-llms-vertex>=0.4.3",     # For Vertex LLMs
    "llama-index-embeddings-openai>=0.3.0", # For OpenAI embeddings
    "llama-index-embeddings-huggingface>=0.3.0", # For HuggingFace embeddings
    "llama-index-vector-stores-faiss>=0.3.0", # For FAISS vector store
    "pymilvus>=2.6.0",                    # For Milvus vector database with BM25 support
    "faiss-cpu>=1.7.0",                   # For FAISS similarity search
    "sentence-transformers>=2.2.0",       # For code-text similarity
    "tree-sitter-language-pack>=0.1.0",  # For code parsing with tree-sitter
    "fastapi>=0.100.0",                   # For API endpoints
    "pydantic>=2.0.0",                    # For data validation
    "uvicorn>=0.20.0",                    # ASGI server for FastAPI
    "rich>=14.0.0",                       # For enhanced terminal output
    "datasets>=3.5.0",                    # For dataset handling and loading
]

[project.optional-dependencies]
dev = ["black>=22.3.0", "isort>=5.10.1", "mypy>=0.950", "flake8>=4.0.1"]
test = ["pytest>=6.0.0", "pytest-cov>=3.0.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"codeminer.scip_interface" = ["*.proto", "*.yml", "*.sh", "README.md"]
